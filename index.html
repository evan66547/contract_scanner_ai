<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <title>Contract Scanner</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260430-premium-ui">
</head>

<body>
  <!-- 状态覆盖层 -->
  <div id="overlay" class="overlay scanning">
    <div class="status-container">
      <div id="status-icon" class="status-icon">⚡️</div>
      <div id="status-text" class="status-text" data-i18n="app.title">Contract Scanner</div>
      <div id="matched-target" class="matched-target"></div>
    </div>

    <!-- 开始按钮 (移出胶囊，居中显示) -->
    <button id="start-btn" class="start-btn" data-i18n="app.start">Tap to Start Scanning</button>

    <!-- 兜底文件上传 -->
    <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none"
      onchange="handleFileUpload(this)">
  </div>

  <!-- 摄像头视频 -->
  <video id="video" autoplay playsinline muted></video>

  <!-- 扫描区域指示框 -->
  <div class="scan-region">
    <div class="scan-corner-bl"></div>
    <div class="scan-corner-br"></div>
    <div class="scan-line"></div>
    <div class="scan-hint">PRO MODE</div>
  </div>

  <!-- 隐藏的Canvas用于截取帧 -->
  <canvas id="canvas" style="display:none;"></canvas>

  <!-- 详细调试信息 -->
  <div id="debug" class="debug"></div>

  <!-- 候选目标列表（位置提升） -->
  <div id="candidates-panel" class="candidates-panel">
    <div class="candidates-header" data-i18n="app.candidates">Possible Matches</div>
    <div id="candidates-list" class="candidates-list">
      <div class="candidate-item low-score">
        <div class="candidate-info">
          <div class="candidate-name candidate-name--dim" data-i18n="app.scanning">Scanning...</div>
        </div>
      </div>
    </div>
  </div>

    <!-- 控制按钮 (位置移动到右下角FAB) -->
  <div class="controls">
    <button id="conn-toggle" class="control-btn" title="连接设置" onclick="toggleConnPanel()">📡</button>
    <button id="lang-toggle" class="control-btn control-btn--wide" onclick="switchLang()"></button>
    <button id="toggle-btn" class="control-btn">🔍</button>
  </div>

  <button id="corner-reset" onclick="resetScanner()" title="重置">↻</button>

  <!-- 连接模式面板 -->
  <div id="conn-panel" class="conn-panel hidden">
    <div class="conn-panel__header">
      <span data-i18n="conn.title">Connection</span>
      <button class="conn-panel__close" onclick="toggleConnPanel()">✕</button>
    </div>
    <div class="conn-panel__body">
      <div class="conn-mode" id="conn-mode-usb" onclick="setConnMode('usb')">
        <div class="conn-mode__icon">🔌</div>
        <div class="conn-mode__info">
          <div class="conn-mode__label" data-i18n="conn.usb">USB Cable</div>
          <div class="conn-mode__desc" id="conn-desc-usb" data-i18n="conn.usb_desc">localhost:8080</div>
        </div>
        <div class="conn-mode__check">✓</div>
      </div>
      <div class="conn-mode" id="conn-mode-wifi" onclick="setConnMode('wifi')">
        <div class="conn-mode__icon">📶</div>
        <div class="conn-mode__info">
          <div class="conn-mode__label" data-i18n="conn.wifi">WiFi</div>
          <div class="conn-mode__desc" id="conn-desc-wifi" data-i18n="conn.wifi_desc">Scan to connect</div>
        </div>
        <div class="conn-mode__check">✓</div>
      </div>
      <div id="conn-qr" class="conn-qr"></div>
      <div id="conn-status" class="conn-status"></div>
    </div>
  </div>

  <!-- AI OCR via Ollama (服务端) -->
  <script src="i18n.js?v=1"></script>
  <script src="app.js?v=20260320-i18n"></script>
</body>

</html>
